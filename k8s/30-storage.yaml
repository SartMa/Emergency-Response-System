apiVersion: v1
kind: Service
metadata:
  name: shard-0
  namespace: erm
spec:
  clusterIP: None                  # headless: one DNS name per pod, shard-0-0.shard-0...
  publishNotReadyAddresses: true   # the coordinator must reach a node while it is still starting
  selector: { app: storage-node, shard: "0" }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard-0
  namespace: erm
spec:
  serviceName: shard-0
  replicas: 2                      # primary + replica (spec: at least 1 replica per shard)
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: storage-node, shard: "0" } }
  template:
    metadata: { labels: { app: storage-node, shard: "0" } }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: storage-node
          image: erm/storage_node:dev
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: erm-config } }]
          env:
            - { name: NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: SHARD_ID, value: "0" }
            - { name: NODE_URL, value: "http://$(NODE_ID).shard-0.erm.svc.cluster.local:8000" }
            - { name: DATA_DIR, value: /data }
          ports: [{ containerPort: 8000 }]
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
      securityContext: { fsGroup: 1000 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 100Mi } } }
---
