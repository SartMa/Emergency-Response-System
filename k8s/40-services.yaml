apiVersion: v1
kind: Service
metadata:
  name: request-service
  namespace: erm
spec:
  selector: { app: request-service }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
  namespace: erm
spec:
  replicas: 2
  selector: { matchLabels: { app: request-service } }
  template:
    metadata: { labels: { app: request-service } }
    spec:
      containers:
        - name: request-service
          image: erm/request_service:dev
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: erm-config } }]
          env:
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: url } } }
          ports: [{ containerPort: 8000 }]
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready, port: 8000 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
