apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: erm
spec:
  selector: { app: coordinator }
  ports: [{ name: http, port: 8000 }]
---
# Exactly one coordinator (spec Table 1). If its pod dies, Kubernetes starts a new one and the
# cluster map is rebuilt from heartbeats within ~5 s (soft state, ADR-14).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: erm
spec:
  replicas: 1
  strategy: { type: Recreate }   # never two coordinators at once, even during an update
  selector: { matchLabels: { app: coordinator } }
  template:
    metadata: { labels: { app: coordinator } }
    spec:
      containers:
        - name: coordinator
          image: erm/coordinator:dev
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: erm-config } }]
          ports: [{ containerPort: 8000 }]
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready, port: 8000 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
