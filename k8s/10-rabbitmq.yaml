apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: erm
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: erm
spec:
  serviceName: rabbitmq
  replicas: 1   # spec: 1 RabbitMQ instance
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: username } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: password } } }
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 500Mi } } }
