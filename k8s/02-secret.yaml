# Demo credentials for LOCAL clusters (minikube) only. The cloud deployment (ansible/) does not
# apply this file: it generates a random password and creates this Secret itself.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: erm
type: Opaque
stringData:
  username: erm
  password: erm-demo-password
  url: amqp://erm:erm-demo-password@rabbitmq:5672/
