# All configuration is env vars (CLAUDE.md rule). Change values here, then `kubectl rollout restart`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: erm-config
  namespace: erm
data:
  COORDINATOR_URL: http://coordinator:8000
  REQUEST_SERVICE_URL: http://request-service:8000
  RESOURCE_SERVICE_URL: http://resource-service:8000
  HEARTBEAT_INTERVAL_S: "2"
  SUSPECT_AFTER_S: "4"
  DEAD_AFTER_S: "6"
  FORMING_GRACE_S: "5"
  MATCH_STRATEGY: nearest   # or: balanced (DESIGN.md §6.3)
  MAX_RADIUS_KM: "50"
