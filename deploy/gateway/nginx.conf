# Local stand-in for the Kubernetes Ingress (API Gateway pattern): one entry point, routed by path.
# Clients never call the individual services or the coordinator directly.
server {
    listen 8080;

    # Docker's embedded DNS; resolving per request means nginx starts even if a service is
    # not up yet, and follows containers that restart with a new IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    set $request_svc  http://request-service:8000;
    set $resource_svc http://resource-service:8000;
    set $matching_svc http://matching-service:8000;

    location = /        { proxy_pass $request_svc; }   # landing page
    location /requests  { proxy_pass $request_svc;  proxy_set_header X-Correlation-ID $http_x_correlation_id; }
    location /resources { proxy_pass $resource_svc; proxy_set_header X-Correlation-ID $http_x_correlation_id; }
    location /match/    { proxy_pass $matching_svc; proxy_set_header X-Correlation-ID $http_x_correlation_id; }

    # /internal/* is deliberately NOT routed: internal APIs stay inside the cluster (NFR-12).
    location / { return 404 '{"error":{"code":"NOT_FOUND","message":"Unknown path"}}'; default_type application/json; }
}
