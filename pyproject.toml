[project]
name = "erm"
version = "0.1.0"
description = "Distributed Emergency Resource Matching System (Semester 7 Cloud Computing project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "ansible-core>=2.21.6",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
